# Generated by karpage rules. Edit the Kar Page config, then run karpage rules.
# This file is sourced from hyprland.conf. It only matches the Kar Page window.
# Firefox is framed by the launcher, because its class stays firefox.

windowrule = tag +karpage, match:class ^(karpage|KarPage|chrome-karpage\.app.*|brave-karpage\.app.*|msedge-karpage\.app.*|vivaldi-karpage\.app.*)$
windowrule = float on, match:class ^(karpage|KarPage|chrome-karpage\.app.*|brave-karpage\.app.*|msedge-karpage\.app.*|vivaldi-karpage\.app.*)$
windowrule = size 430 932, match:class ^(karpage|KarPage|chrome-karpage\.app.*|brave-karpage\.app.*|msedge-karpage\.app.*|vivaldi-karpage\.app.*)$
windowrule = move monitor_w-window_w-48 (monitor_h-window_h)/2, match:class ^(karpage|KarPage|chrome-karpage\.app.*|brave-karpage\.app.*|msedge-karpage\.app.*|vivaldi-karpage\.app.*)$
windowrule = rounding 46, match:class ^(karpage|KarPage|chrome-karpage\.app.*|brave-karpage\.app.*|msedge-karpage\.app.*|vivaldi-karpage\.app.*)$
windowrule = rounding_power 4, match:class ^(karpage|KarPage|chrome-karpage\.app.*|brave-karpage\.app.*|msedge-karpage\.app.*|vivaldi-karpage\.app.*)$
windowrule = border_size 2, match:class ^(karpage|KarPage|chrome-karpage\.app.*|brave-karpage\.app.*|msedge-karpage\.app.*|vivaldi-karpage\.app.*)$
windowrule = border_color rgb(ececec) rgb(2b2b2b), match:class ^(karpage|KarPage|chrome-karpage\.app.*|brave-karpage\.app.*|msedge-karpage\.app.*|vivaldi-karpage\.app.*)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(karpage|KarPage|chrome-karpage\.app.*|brave-karpage\.app.*|msedge-karpage\.app.*|vivaldi-karpage\.app.*)$
